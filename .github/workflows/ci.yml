name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # glassEffect needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcrun swift --version
      - run: make test
      - name: Build the app bundle
        run: |
          make app
          plutil -lint RoamRun.app/Contents/Info.plist
          codesign --verify --strict RoamRun.app
