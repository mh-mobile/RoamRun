name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: an advisory published since is seen without a push

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: No advisory against a crate Cargo.lock pins that hasn't been looked into
        run: python3 scripts/audit-crates.py

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # glassEffect needs the macOS 26 SDK. Xcode 27 is a public preview image: a
        # failure there is worth seeing but doesn't block a merge.
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - run: xcrun swift --version
      - name: Rust (the version Rust/RoamRunDevice/rust-toolchain.toml names; rustup fetches it)
        run: cd Rust/RoamRunDevice && cargo --version
      - run: make test
      - name: The licenses the app carries are those of the crates it is built from
        run: |
          make licenses
          git diff --exit-code THIRD-PARTY-LICENSES.txt
      - name: Build the app bundle
        run: |
          make app
          plutil -lint RoamRun.app/Contents/Info.plist
          codesign --verify --strict RoamRun.app
          plutil -extract CFBundleVersion raw Info.plist | grep -Eq '^[0-9]+$'
          RoamRun.app/Contents/MacOS/RoamRun --help | grep -q 'look <name>'
          RoamRun.app/Contents/MacOS/RoamRun init --print | head -2 | grep -qx 'name: roamrun'   # init/--uninstall rely on this header
      - name: No warnings in the app, the tests or the SNAPSHOT variant (Swift 6 mode, data races are errors)
        run: |
          xcrun swift build --build-tests -Xswiftc -warnings-as-errors
          xcrun swift build -Xswiftc -DSNAPSHOT -Xswiftc -warnings-as-errors
