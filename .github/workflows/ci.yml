name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # glassEffect needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcrun swift --version
      - run: sysctl -n hw.ncpu hw.memsize
      - run: xcrun swift test --no-parallel
        continue-on-error: true
      - run: make test
