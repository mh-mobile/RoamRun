name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: an advisory published since is seen without a push

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: No advisory against a crate Cargo.lock pins that hasn't been looked into
        run: python3 scripts/audit-crates.py

  # The stand-in for a machine that has no RoamRun: tested where it is meant to run, and built
  # there as the archives a release carries (kept two weeks; `make roamrunctl-archives` takes
  # those of the release's commit). The Mac's isn't here: Homebrew builds it from source.
  roamrunctl:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one binary for any distribution, whatever its libc.
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-aarch64 }
          - { runner: macos-26, target: "", name: macos }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: Rust/roamrunctl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Rust (the version rust-toolchain.toml names; rustup fetches it)
        run: cargo --version
      - run: cargo build --locked
      - run: cargo test --locked
      - name: The archive a release carries
        if: matrix.target != ''
        run: |
          version=$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' ../../Info.plist)
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          # Named without the version: the newest release's is then always at one address.
          dir=roamrunctl-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/roamrunctl* README.md THIRD-PARTY-LICENSES.txt ../../LICENSE "$dir/"
          rm -f "$dir"/roamrunctl.d "$dir"/roamrunctl.pdb
          "$dir"/roamrunctl* --version | grep -qx "roamrunctl $version"
          if [ "${{ runner.os }}" = Windows ]; then 7z a -tzip "$dir.zip" "$dir" >/dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: matrix.target != ''
        with:
          name: roamrunctl-${{ matrix.name }}
          path: |
            Rust/roamrunctl/roamrunctl-*.tar.gz
            Rust/roamrunctl/roamrunctl-*.zip
          retention-days: 14
          if-no-files-found: error

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # glassEffect needs the macOS 26 SDK. Xcode 27 is a public preview image: a
        # failure there is worth seeing but doesn't block a merge.
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - run: xcrun swift --version
      - name: Rust (the version Rust/RoamRunDevice/rust-toolchain.toml names; rustup fetches it)
        run: cd Rust/RoamRunDevice && cargo --version
      - name: Tests (still running after ten minutes, the test process's stacks are printed)
        timeout-minutes: 15
        run: |
          (sleep 600; for p in $(pgrep -f swiftpm-testing); do sample "$p" 2 -mayDie 2>/dev/null | head -300; done) &
          rc=0; make test || rc=$?
          kill %1 2>/dev/null || true
          exit $rc
      - name: The licenses the app carries are those of the crates it is built from
        run: |
          make licenses
          git diff --exit-code THIRD-PARTY-LICENSES.txt Rust/roamrunctl/THIRD-PARTY-LICENSES.txt
      - name: Build the app bundle
        run: |
          make app
          plutil -lint RoamRun.app/Contents/Info.plist
          codesign --verify --strict RoamRun.app
          plutil -extract CFBundleVersion raw Info.plist | grep -Eq '^[0-9]+$'
          RoamRun.app/Contents/MacOS/RoamRun --help | grep -q 'look <name>'
          RoamRun.app/Contents/MacOS/RoamRun init --print | head -2 | grep -qx 'name: roamrun'   # init/--uninstall rely on this header
      - name: No warnings in the app, the tests or the SNAPSHOT variant (Swift 6 mode, data races are errors)
        run: |
          xcrun swift build --build-tests -Xswiftc -warnings-as-errors
          xcrun swift build -Xswiftc -DSNAPSHOT -Xswiftc -warnings-as-errors
