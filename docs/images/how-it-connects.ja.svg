<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-label="RoamRun がデバイスの接続先を Mac のネットワークに知らせます。Xcode が使う macOS のサービス remotepairingd がそれを見つけて RoamRun に接続し、RoamRun が Tailscale 越しに、別の Wi-Fi にある iPhone との通信を双方向に中継します。">
  <title>RoamRun がデバイスの接続先を Mac のネットワークに知らせます。Xcode が使う macOS のサービス remotepairingd がそれを見つけて RoamRun に接続し、RoamRun が Tailscale 越しに、別の Wi-Fi にある iPhone との通信を双方向に中継します。</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .frame { fill: #fff; font-size: 23px; font-weight: 700; }
    .name { fill: #111827; font-size: 25px; font-weight: 700; }
    .daemon { fill: #111827; font-size: 21px; font-weight: 700; }
    .sub { fill: #374151; font-size: 17px; }
    .num { fill: #111827; font-size: 20px; font-weight: 700; }
    .tag { fill: #111827; font-size: 19px; font-weight: 700; }
    .note { fill: #fff; font-size: 18px; }
  </style>
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f59e0b"/></marker>
  </defs>

  <rect x="6" y="6" width="768" height="250" rx="18" fill="#1e3a5f"/>
  <text class="frame" x="390" y="46">自宅の Mac</text>

  <rect x="24" y="70" width="176" height="166" rx="12" fill="#fff"/>
  <text class="name" x="112" y="140">Xcode</text>
  <text class="sub" x="112" y="172">ビルド、実行、</text>
  <text class="sub" x="112" y="196">デバッグ</text>

  <rect x="262" y="70" width="200" height="166" rx="12" fill="#fff"/>
  <text class="daemon" x="362" y="140">remotepairingd</text>
  <text class="sub" x="362" y="172">デバイスに接続する</text>
  <text class="sub" x="362" y="196">macOS のサービス</text>

  <rect x="570" y="70" width="186" height="166" rx="12" fill="#fff"/>
  <text class="name" x="663" y="140">RoamRun</text>
  <text class="sub" x="663" y="172">デバイスを知らせ、</text>
  <text class="sub" x="663" y="196">通信を中継</text>

  <line x1="204" y1="153" x2="256" y2="153" stroke="#fff" stroke-width="3.5" marker-end="url(#w)"/>
  <line x1="566" y1="114" x2="468" y2="114" stroke="#fff" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#w)"/>
  <circle cx="516" cy="114" r="18" fill="#f59e0b"/><text class="num" x="516" y="121">1</text>
  <line x1="466" y1="192" x2="564" y2="192" stroke="#fff" stroke-width="3.5" marker-end="url(#w)"/>
  <circle cx="516" cy="192" r="18" fill="#f59e0b"/><text class="num" x="516" y="199">2</text>

  <rect x="6" y="338" width="444" height="148" rx="18" fill="#374151"/>
  <text class="note" x="228" y="378">ペアリングの検証と暗号化は、</text>
  <text class="note" x="228" y="405">Apple の実装のまま、</text>
  <text class="note" x="228" y="432">Mac とデバイスの間で行われます。</text>
  <text class="note" x="228" y="459">RoamRun は中継するだけです。</text>

  <rect x="470" y="338" width="304" height="148" rx="18" fill="#14532d"/>
  <text class="frame" x="520" y="420">外出先</text>
  <rect x="570" y="352" width="186" height="120" rx="12" fill="#fff"/>
  <text class="name" x="663" y="396">iPhone</text>
  <text class="sub" x="663" y="426">Tailscale をオン</text>
  <text class="sub" x="663" y="450">別の Wi-Fi</text>

  <line x1="663" y1="242" x2="663" y2="346" stroke="#f59e0b" stroke-width="8" marker-start="url(#o)" marker-end="url(#o)"/>
  <circle cx="663" cy="296" r="18" fill="#f59e0b"/><text class="num" x="663" y="303">3</text>
  <rect x="520" y="278" width="116" height="36" rx="18" fill="#f59e0b"/>
  <text class="tag" x="578" y="303">Tailscale</text>
</svg>
