<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Xcode on the Mac at home finds the iPhone through RoamRun, which relays the connection over Tailscale to the iPhone on another network.">
  <title>Xcode on the Mac at home finds the iPhone through RoamRun, which relays the connection over Tailscale to the iPhone on another network.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .frame { fill: #fff; font-size: 23px; font-weight: 700; }
    .name { fill: #111827; font-size: 28px; font-weight: 700; }
    .sub { fill: #374151; font-size: 17px; }
    .num { fill: #111827; font-size: 20px; font-weight: 700; }
    .tag { fill: #111827; font-size: 19px; font-weight: 700; }
  </style>
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="6" y="6" width="590" height="288" rx="18" fill="#1e3a5f"/>
  <text class="frame" x="301" y="48">Mac at home</text>
  <rect x="724" y="6" width="190" height="288" rx="18" fill="#14532d"/>
  <text class="frame" x="819" y="48">Away</text>

  <rect x="26" y="76" width="204" height="194" rx="12" fill="#fff"/>
  <text class="name" x="128" y="158">Xcode</text>
  <text class="sub" x="128" y="192">Build, run</text>
  <text class="sub" x="128" y="216">and debug</text>

  <rect x="372" y="76" width="204" height="194" rx="12" fill="#fff"/>
  <text class="name" x="474" y="158">RoamRun</text>
  <text class="sub" x="474" y="192">Stands in for</text>
  <text class="sub" x="474" y="216">the iPhone</text>

  <rect x="744" y="76" width="150" height="194" rx="12" fill="#fff"/>
  <text class="name" x="819" y="158">iPhone</text>
  <text class="sub" x="819" y="192">On another</text>
  <text class="sub" x="819" y="216">network</text>

  <line x1="234" y1="132" x2="366" y2="132" stroke="#fff" stroke-width="3.5" marker-end="url(#w)"/>
  <circle cx="300" cy="132" r="18" fill="#f59e0b"/><text class="num" x="300" y="139">1</text>
  <line x1="368" y1="214" x2="236" y2="214" stroke="#fff" stroke-width="3.5" marker-end="url(#w)"/>
  <circle cx="300" cy="214" r="18" fill="#f59e0b"/><text class="num" x="300" y="221">2</text>

  <line x1="580" y1="173" x2="738" y2="173" stroke="#f59e0b" stroke-width="8" marker-end="url(#o)"/>
  <circle cx="660" cy="173" r="18" fill="#f59e0b"/><text class="num" x="660" y="180">3</text>
  <rect x="602" y="104" width="116" height="36" rx="18" fill="#f59e0b"/>
  <text class="tag" x="660" y="129">Tailscale</text>
</svg>
